spring.application.name=servicio-mensajeria
server.port=8086

# Base de datos RDS PostgreSQL (AWS)
spring.datasource.url=jdbc:postgresql://pedidos360.cdkqqe6kw6u1.us-east-1.rds.amazonaws.com:5432/mensajeria_db?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seguridad Azure AD JWT
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/4646e528-a2b6-4aac-b415-5b0ddd4897d8/discovery/v2.0/keys

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Resilience4j
resilience4j.circuitbreaker.instances.usuariosCB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.usuariosCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.usuariosCB.waitDurationInOpenState=5s

# URLs externas
servicio.usuarios.url=${SERVICIO_USUARIOS_URL:http://127.0.0.1:8081}

# Swagger
springdoc.api-docs.path=/api/mensajes/v3/api-docs
springdoc.swagger-ui.enabled=false

# Reintentos de Consumo y DLQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000ms
spring.rabbitmq.listener.simple.retry.multiplier=1.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false